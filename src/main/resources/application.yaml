cdc:
  sources:
    primary-db:  # 给每个数据源一个明确的名称
      ip: localhost
      port: 3306
      username: root
      password: xu.123456
      databases:
        - big_screen1
      tables:
        - big_screen1.order
      parallelism: 2
      description: "big_screen1"

    inventory-db:
      ip: 122.112.192.164
      port: 3306
      username: root
      password: xu.123456
      databases:
        - big_screen2
      tables:
        - big_screen2.order
      server-time-zone: "UTC"
      parallelism: 2
      description: "big_screen2"
